# CI del segundo cerebro: sintaxis de shell, compilación de Python,
# tests del parser de feeds y smoke test del cron de noticias.
name: ci

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "wiki/**"
      - ".obsidian/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis bash de todos los .sh
        run: |
          fallo=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "FALLO: $f"; fallo=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -not -path './node_modules/*' -print0)
          exit "$fallo"

      - name: Compilación de todos los .py
        run: |
          find . -name '*.py' -not -path './.git/*' -not -path './node_modules/*' -print0 \
            | xargs -0 python3 -m py_compile

      - name: Tests del parser de feeds
        run: python3 -m unittest discover tests -v

      - name: Smoke test del cron de noticias
        run: bash tests/smoke-cron.sh
